{% extends "base.html" %}
{% block title %}Admin · HireFlow{% endblock %}
{% block content %}
<h1 class="h3 mb-4">User management</h1>
<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Created</th></tr></thead>
      <tbody>
      {% for user in users %}
        <tr>
          <td>{{ user.username }}</td>
          <td>{{ user.email }}</td>
          <td>
            <form class="d-flex gap-2" method="post" action="{{ url_for('recruiter.update_user_role', user_id=user.id) }}">
              <select class="form-select form-select-sm" name="role">
                {% for role in ['applicant', 'recruiter', 'admin'] %}
                  <option value="{{ role }}" {% if user.role == role %}selected{% endif %}>{{ role }}</option>
                {% endfor %}
              </select>
              <button class="btn btn-sm btn-outline-primary" type="submit">Save</button>
            </form>
          </td>
          <td>{{ user.created_at.strftime('%b %d, %Y') }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
