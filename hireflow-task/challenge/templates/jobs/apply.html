{% extends "base.html" %}
{% block title %}Apply · HireFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3">Apply for {{ job.title }}</h1>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Cover letter</label>
            <textarea class="form-control" name="cover_letter" rows="8" placeholder="Share the experience most relevant to this role."></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Submit application</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
